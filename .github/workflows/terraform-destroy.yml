name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: "Type DESTROY to confirm"
        required: true
        type: string

env:
  TF_VERSION: "1.16.5"
  AWS_REGION: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  validate-input:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "❌ You must type DESTROY in the confirm field to proceed."
            exit 1
          fi
          echo "✅ Confirmation accepted. Proceeding with destroy of ${{ github.event.inputs.environment }}."

  destroy:
    name: Destroy (${{ github.event.inputs.environment }})
    needs: validate-input
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}   # approval gate — pauses here
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
